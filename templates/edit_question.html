
{% extends "base.html" %}

{% block title %}Edit Quiz Question | CodeQuest{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Edit Quiz Question</h2>
    <p class="text-muted">Update the question and its answer options.</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Select Lesson</label>

            <select name="lesson_id" class="form-select" required>

                {% for lesson in lessons %}

                <option value="{{ lesson.id }}"
                    {% if lesson.id == question.lesson_id %}
                        selected
                    {% endif %}>

                    Lesson {{ lesson.lesson_number }} - {{ lesson.title }}

                </option>

                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Question</label>

            <textarea name="question"
                      class="form-control"
                      rows="3"
                      required>{{ question.question }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Option A</label>
            <input type="text" name="option_a"
                   class="form-control"
                   value="{{ question.option_a }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Option B</label>
            <input type="text" name="option_b"
                   class="form-control"
                   value="{{ question.option_b }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Option C</label>
            <input type="text" name="option_c"
                   class="form-control"
                   value="{{ question.option_c }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Option D</label>
            <input type="text" name="option_d"
                   class="form-control"
                   value="{{ question.option_d }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Correct Answer</label>

            <select name="correct_answer"
                    class="form-select"
                    required>

                <option value="A" {% if question.correct_answer == "A" %}selected{% endif %}>Option A</option>
                <option value="B" {% if question.correct_answer == "B" %}selected{% endif %}>Option B</option>
                <option value="C" {% if question.correct_answer == "C" %}selected{% endif %}>Option C</option>
                <option value="D" {% if question.correct_answer == "D" %}selected{% endif %}>Option D</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Explanation</label>

            <textarea name="explanation"
                      class="form-control"
                      rows="4">{{ question.explanation or "" }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('manage_questions') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
