{% extends "base.html" %}

{% block title %}Learning Arena{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        🎮 Learning Arena
    </h2>

    <p class="text-muted">
        Choose a lesson to practice coding questions.
    </p>

    <div class="row">

        {% for lesson in lessons %}

        <div class="col-md-4 mb-4">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4>{{ lesson.title }}</h4>

                    <p>{{ lesson.description }}</p>

                    <a href="{{ url_for('arena_lesson', lesson_id=lesson.id) }}"
                       class="btn btn-success">

                        Open Practice

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
