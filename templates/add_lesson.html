
{% extends "base.html" %}

{% block title %}Add Lesson | CodeQuest{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Add New Lesson</h2>
    <p class="text-muted">Enter the details of the new lesson.</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Lesson Number</label>
            <input type="number"
                   name="lesson_number"
                   class="form-control"
                   min="1"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Lesson Title</label>
            <input type="text"
                   name="title"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text"
                   name="description"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Lesson Content</label>
            <textarea name="content"
                      class="form-control"
                      rows="12"
                      required></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Add Lesson
        </button>

        <a href="{{ url_for('manage_lessons') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
