
{% extends "base.html" %}

{% block title %}Add Quiz Question | CodeQuest{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Add Quiz Question</h2>
    <p class="text-muted">Create a new question for a lesson.</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Select Lesson</label>

            <select name="lesson_id" class="form-select" required>

                <option value="">Choose a lesson</option>

                {% for lesson in lessons %}
                <option value="{{ lesson.id }}">
                    Lesson {{ lesson.lesson_number }} - {{ lesson.title }}
                </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Question</label>
            <textarea name="question"
                      class="form-control"
                      rows="3"
                      required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Option A</label>
            <input type="text" name="option_a"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Option B</label>
            <input type="text" name="option_b"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Option C</label>
            <input type="text" name="option_c"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Option D</label>
            <input type="text" name="option_d"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Correct Answer</label>

            <select name="correct_answer"
                    class="form-select"
                    required>

                <option value="">Select correct option</option>
                <option value="A">Option A</option>
                <option value="B">Option B</option>
                <option value="C">Option C</option>
                <option value="D">Option D</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Explanation</label>

            <textarea name="explanation"
                      class="form-control"
                      rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-success">
            Add Question
        </button>

        <a href="{{ url_for('manage_questions') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
